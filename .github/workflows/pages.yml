name: Test e pubblicazione gioco

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Test del gioco
        run: node tests/tests.cjs
      - name: Test del controllo changelog
        run: node tests/check-changelog.cjs
      - name: Prepara i file del sito
        run: |
          mkdir -p _site
          cp index.html LICENSE _site/
          cp -R src styles _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
